<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070a0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mook</title>
  <style>
    :root {
      --ink: #f5f7f4;
      --muted: #8d9891;
      --void: #070a0d;
      --cell: #11171a;
      --line: #243034;
      --green: #39e071;
      --green-hot: #8bffad;
      --danger: #ff5c64;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); }
    body {
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    button { font: inherit; }
    .app {
      width: min(100vw, 520px);
      height: 100dvh;
      min-height: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background:
        radial-gradient(circle at 50% -10%, rgba(57,224,113,.12), transparent 34%),
        var(--void);
      position: relative;
      isolation: isolate;
    }
    .topbar {
      padding: max(16px, env(safe-area-inset-top)) 18px 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 70px;
    }
    .brand { font-size: 18px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    .score { justify-self: center; display: grid; justify-items: center; gap: 1px; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 800; color: var(--muted); }
    .score b { color: var(--ink); font-size: 20px; padding-left: 5px; }
    .score small { color: #768186; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .score strong { color: #c6d0d4; font-size: 12px; padding-left: 3px; }
    .lives { justify-self: end; display: flex; gap: 6px; }
    .life { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px rgba(57,224,113,.5); transition: .2s ease; }
    .life.lost { background: #283034; box-shadow: none; transform: scale(.74); }
    .timer-shell { height: 5px; margin: 0 18px 14px; background: #1a2225; overflow: hidden; border-radius: 99px; }
    .timer { height: 100%; width: 100%; transform-origin: left; background: var(--green); box-shadow: 0 0 16px rgba(57,224,113,.7); }
    .timer.danger { background: var(--danger); box-shadow: 0 0 16px rgba(255,92,100,.65); }
    .board {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      padding: 0 8px max(8px, env(safe-area-inset-bottom));
    }
    .cell {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.025), transparent 45%),
        var(--cell);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      touch-action: none;
      transition: transform 70ms ease, background 120ms ease, border-color 120ms ease;
    }
    .cell:active { transform: scale(.98); }
    .cell.active {
      background:
        radial-gradient(circle at 45% 35%, rgba(255,255,255,.24), transparent 38%),
        var(--green);
      border-color: var(--green-hot);
      box-shadow: 0 0 28px rgba(57,224,113,.35), inset 0 1px 0 rgba(255,255,255,.32);
      animation: green-in 130ms ease-out;
    }
    .cell.red {
      background:
        radial-gradient(circle at 45% 35%, rgba(255,255,255,.2), transparent 38%),
        var(--danger);
      border-color: #ff9297;
      box-shadow: 0 0 28px rgba(255,92,100,.3), inset 0 1px 0 rgba(255,255,255,.28);
      animation: green-in 130ms ease-out;
    }
    .cell.blue {
      background:
        radial-gradient(circle at 45% 35%, rgba(255,255,255,.24), transparent 38%),
        #48b9f2;
      border-color: #a8e2ff;
      box-shadow: 0 0 28px rgba(72,185,242,.34), inset 0 1px 0 rgba(255,255,255,.3);
      animation: green-in 130ms ease-out;
    }
    .cell.blue::before {
      content: attr(data-arrow);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font: 1000 clamp(48px, 18vw, 84px)/1 system-ui, sans-serif;
      text-shadow: 0 3px 14px rgba(0,70,110,.28);
    }
    .cell.blue.tutorial::before { transform: translateY(-13px); }
    .cell.blue.tutorial::after {
      content: "SWIPE " attr(data-direction);
      position: absolute;
      left: 8px; right: 8px; bottom: 17px;
      color: white;
      font: 950 11px/1 system-ui, sans-serif;
      letter-spacing: .11em;
      text-align: center;
    }
    .cell.yellow {
      background:
        radial-gradient(circle at 45% 35%, rgba(255,255,255,.3), transparent 38%),
        #f5c542;
      border-color: #ffe79a;
      box-shadow: 0 0 28px rgba(245,197,66,.34), inset 0 1px 0 rgba(255,255,255,.34);
      animation: green-in 130ms ease-out;
    }
    .cell.yellow::before {
      content: "HOLD";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #3a2b00;
      font: 1000 clamp(20px, 7vw, 34px)/1 system-ui, sans-serif;
      letter-spacing: .08em;
    }
    .cell.yellow.tutorial::after {
      content: "HOLD FOR 1 SECOND";
      position: absolute;
      left: 8px; right: 8px; bottom: 17px;
      color: #3a2b00;
      font: 950 10px/1 system-ui, sans-serif;
      letter-spacing: .08em;
      text-align: center;
    }
    .cell.yellow.tutorial::before { transform: translateY(-12px); }
    .cell.yellow.holding { animation: yellow-hold 1s linear forwards; }
    .cell.yellow-bounce { animation: yellow-bounce .38s cubic-bezier(.2,.9,.3,1.35); }
    .cell.hold-complete { animation: hold-complete .3s ease-in both; pointer-events: none; }
    .cell.rock {
      background:
        radial-gradient(ellipse at 34% 28%, rgba(255,255,255,.22), transparent 22%),
        radial-gradient(ellipse at 65% 70%, rgba(0,0,0,.22), transparent 34%),
        linear-gradient(145deg, #8b9498, #4c555a);
      border-color: #aeb7bb;
      box-shadow: 0 0 24px rgba(160,171,176,.2), inset 0 2px 0 rgba(255,255,255,.2), inset 0 -3px 8px rgba(0,0,0,.22);
      animation: green-in 130ms ease-out;
    }
    .cell.rock::before {
      content: attr(data-hits);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font: 1000 clamp(48px, 18vw, 86px)/1 system-ui, sans-serif;
      text-shadow: 0 3px 8px rgba(0,0,0,.45);
    }
    .cell.rock.cracked-2 {
      background:
        linear-gradient(64deg, transparent 47%, #252c2f 48% 50%, transparent 51%) 40% 30%/55% 65% no-repeat,
        radial-gradient(ellipse at 34% 28%, rgba(255,255,255,.2), transparent 22%),
        linear-gradient(145deg, #838c90, #475055);
    }
    .cell.rock.cracked-1 {
      background:
        linear-gradient(64deg, transparent 47%, #1e2427 48% 51%, transparent 52%) 36% 20%/60% 80% no-repeat,
        linear-gradient(118deg, transparent 47%, #2a3135 48% 50%, transparent 51%) 68% 50%/55% 65% no-repeat,
        radial-gradient(ellipse at 34% 28%, rgba(255,255,255,.14), transparent 22%),
        linear-gradient(145deg, #717a7e, #3e474b);
      filter: contrast(1.08);
    }
    .cell.rock.tutorial::after {
      content: "TAP 3 TIMES";
      position: absolute;
      left: 8px; right: 8px; bottom: 17px;
      color: white;
      font: 950 10px/1 system-ui, sans-serif;
      letter-spacing: .09em;
      text-align: center;
    }
    .cell.rock-hit { animation: rock-hit .16s linear; }
    .cell.rock-break { animation: rock-break .32s ease-in both; pointer-events: none; }
    .cell.slide-up { animation: slide-up .3s ease-in both; pointer-events: none; }
    .cell.slide-right { animation: slide-right .3s ease-in both; pointer-events: none; }
    .cell.slide-down { animation: slide-down .3s ease-in both; pointer-events: none; }
    .cell.slide-left { animation: slide-left .3s ease-in both; pointer-events: none; }
    .cell.blue-wrong { animation: blue-wrong .32s ease both; }
    .cell.penalty::after {
      content: "−1";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: clamp(28px, 10vw, 56px);
      color: white;
      animation: pop .28s ease-out both;
    }
    .cell.hit::after {
      content: "+1";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 1000;
      font-size: clamp(28px, 10vw, 56px);
      color: white;
      animation: pop .24s ease-out both;
    }
    .cell.wrong { animation: wrong .18s linear; }
    .checkpoint-banner {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(7,10,13,.9);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .checkpoint-banner.show {
      opacity: 1;
      visibility: visible;
      animation: checkpoint-in 1.55s ease both;
    }
    .checkpoint-copy { text-align: center; }
    .checkpoint-kicker { color: var(--green); font-size: 13px; font-weight: 950; letter-spacing: .22em; text-transform: uppercase; }
    .checkpoint-title { margin: 10px 0 8px; font-size: clamp(46px, 16vw, 76px); line-height: .9; letter-spacing: -.06em; }
    .checkpoint-subtitle { color: #b3bcb7; font-size: 16px; }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(7,10,13,.86);
      backdrop-filter: blur(14px);
      transition: opacity .25s ease, visibility .25s ease;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card { width: min(100%, 350px); text-align: center; }
    .mark {
      width: 86px; height: 86px; margin: 0 auto 24px;
      border-radius: 24px; background: var(--green);
      box-shadow: 0 0 50px rgba(57,224,113,.28);
      display: grid; place-items: center;
      color: #071109; font-size: 44px; font-weight: 1000;
      transform: rotate(-3deg);
    }
    h1 { margin: 0; font-size: clamp(54px, 18vw, 82px); line-height: .9; letter-spacing: -.075em; }
    .subtitle { margin: 18px auto 28px; color: #b3bcb7; max-width: 270px; line-height: 1.45; font-size: 16px; }
    .primary {
      width: 100%; min-height: 58px; border: 0; border-radius: 16px;
      color: #071109; background: var(--green); font-weight: 950; font-size: 17px;
      box-shadow: 0 10px 32px rgba(57,224,113,.18); cursor: pointer;
    }
    .primary:active { transform: translateY(1px) scale(.99); }
    .result { display: none; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .15em; font-weight: 800; margin-bottom: 10px; }
    .final { display: none; font-size: 68px; font-weight: 1000; letter-spacing: -.06em; margin-bottom: 8px; }
    .game-over .mark { background: var(--danger); box-shadow: 0 0 50px rgba(255,92,100,.2); }
    .game-over .result, .game-over .final { display: block; }
    .game-over h1 { font-size: 42px; letter-spacing: -.04em; }
    @keyframes green-in { from { transform: scale(.94); filter: brightness(1.4); } to { transform: scale(1); } }
    @keyframes pop { from { opacity: 1; transform: scale(.65); } to { opacity: 0; transform: scale(1.25) translateY(-10px); } }
    @keyframes wrong { 0%,100% { border-color: var(--line); } 50% { border-color: var(--danger); background: rgba(255,92,100,.2); } }
    @keyframes checkpoint-in { 0% { opacity: 0; transform: scale(1.08); } 18%,76% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.96); } }
    @keyframes slide-up { to { opacity: 0; transform: translateY(-115%) scale(.82); } }
    @keyframes slide-right { to { opacity: 0; transform: translateX(115%) scale(.82); } }
    @keyframes slide-down { to { opacity: 0; transform: translateY(115%) scale(.82); } }
    @keyframes slide-left { to { opacity: 0; transform: translateX(-115%) scale(.82); } }
    @keyframes blue-wrong { 0%,100% { transform: translateX(0); filter: none; } 25% { transform: translateX(-10px); filter: saturate(.25); } 50% { transform: translateX(9px); background: var(--danger); } 75% { transform: translateX(-5px); } }
    @keyframes yellow-hold { from { transform: scale(1); border-radius: 18px; } to { transform: scale(.28); border-radius: 50%; filter: brightness(1.25); } }
    @keyframes yellow-bounce { 0% { transform: scale(.58); } 65% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes hold-complete { to { opacity: 0; transform: scale(.05); filter: brightness(1.6); } }
    @keyframes rock-hit { 0%,100% { transform: translate(0); } 30% { transform: translate(-7px,3px) rotate(-2deg); } 70% { transform: translate(6px,-2px) rotate(2deg); } }
    @keyframes rock-break { 35% { transform: scale(1.08); filter: brightness(1.35); } to { opacity: 0; transform: scale(.18) rotate(8deg); filter: contrast(1.5); } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">Mook</div>
      <div class="score"><span>Score <b id="score">0</b></span><small>Best <strong id="best">0</strong></small></div>
      <div class="lives" aria-label="Four lives">
        <i class="life"></i><i class="life"></i><i class="life"></i><i class="life"></i>
      </div>
    </header>
    <div class="timer-shell"><div class="timer" id="timer"></div></div>
    <section class="board" id="board" aria-label="Game board"></section>

    <section class="checkpoint-banner" id="checkpointBanner" aria-live="polite">
      <div class="checkpoint-copy">
        <div class="checkpoint-kicker">Milestone reached</div>
        <h2 class="checkpoint-title" id="checkpointTitle">Checkpoint</h2>
        <div class="checkpoint-subtitle" id="checkpointSubtitle">New move unlocked</div>
      </div>
    </section>

    <section class="overlay" id="overlay">
      <div class="card" id="card">
        <div class="mark">M</div>
        <div class="result">Final score</div>
        <div class="final" id="finalScore">0</div>
        <h1 id="title">Mook.</h1>
        <p class="subtitle" id="subtitle">Tap every green within two seconds. Avoid red. After 30 seconds, swipe blue arrows in their direction.</p>
        <button class="primary" id="start">Start game</button>
      </div>
    </section>
  </main>

  <script>
    const board = document.querySelector('#board');
    const timerEl = document.querySelector('#timer');
    const scoreEl = document.querySelector('#score');
    const bestEl = document.querySelector('#best');
    const overlay = document.querySelector('#overlay');
    const card = document.querySelector('#card');
    const startBtn = document.querySelector('#start');
    const titleEl = document.querySelector('#title');
    const subtitleEl = document.querySelector('#subtitle');
    const finalScoreEl = document.querySelector('#finalScore');
    const lifeEls = [...document.querySelectorAll('.life')];
    const checkpointBanner = document.querySelector('#checkpointBanner');
    const checkpointTitleEl = document.querySelector('#checkpointTitle');
    const checkpointSubtitleEl = document.querySelector('#checkpointSubtitle');

    const cells = Array.from({ length: 8 }, (_, index) => {
      const button = document.createElement('button');
      button.className = 'cell';
      button.type = 'button';
      button.setAttribute('aria-label', `Tile ${index + 1}`);
      wireCellGesture(button, index);
      board.append(button);
      return button;
    });

    const BASE_BEAT_MS = 1000;
    const FAST_BEAT_MS = 500;
    const GREEN_LIFETIME_MS = 2000;
    const RED_LIFETIME_MS = 2000;
    const RED_START_MS = 10000;
    const CHAOS_START_MS = 20000;
    const BLUE_START_MS = 30000;
    const BLUE_LIFETIME_MS = 2000;
    const YELLOW_LIFETIME_MS = 3000;
    const YELLOW_HOLD_MS = 1000;
    const PHASE_RAMP_MS = 15000;
    const TRIPLE_GREEN_START_MS = 15000;
    const DOUBLE_BLUE_START_MS = 30000;
    const SECOND_CHECKPOINT_MS = 45000;
    const THIRD_CHECKPOINT_MS = 60000;
    const ROCK_LIFETIME_MS = 4000;
    const ROCK_HITS = 3;
    const RED_CHANCE = .25;
    const BLUE_CHANCE = .25;
    const YELLOW_CHANCE = .2;
    const ROCK_CHANCE = .16;
    const SWIPE_THRESHOLD = 34;
    let activeGreens = new Map();
    let score = 0;
    let highScore = loadHighScore();
    bestEl.textContent = highScore;
    let misses = 0;
    let playing = false;
    let roundStarted = 0;
    let roundLength = BASE_BEAT_MS;
    let gameStartedAt = 0;
    let raf = 0;
    let cycleTimer = 0;
    let lastGreens = new Set();
    let graceCells = new Map();
    let redCells = new Map();
    let blueCells = new Map();
    let blueGraceCells = new Set();
    let blueGraceUntil = 0;
    let yellowCells = new Map();
    let yellowGraceCells = new Set();
    let yellowGraceUntil = 0;
    let rockCells = new Map();
    let rockGraceCells = new Set();
    let rockGraceUntil = 0;
    let resolvingCells = new Set();
    let animationTimers = new Map();
    let checkpointReached = false;
    let checkpointLevel = 0;
    let blueUnlocked = false;
    let yellowUnlocked = false;
    let rockUnlocked = false;
    let tutorialActive = false;
    let phase2StartedAt = 0;
    let phase3StartedAt = 0;
    let phase4StartedAt = 0;
    let checkpointScore = 0;
    let continueUsed = false;
    let canContinue = false;
    let checkpointTimer = 0;
    let audio;

    function loadHighScore() {
      try {
        const value = Number(localStorage.getItem('mook-high-score'));
        return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
      } catch (_) { return 0; }
    }

    function addScore(points = 1) {
      score += points;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        bestEl.textContent = highScore;
        try { localStorage.setItem('mook-high-score', String(highScore)); } catch (_) {}
      }
    }

    function tone(frequency, duration, volume = .04) {
      try {
        audio ||= new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duration);
        oscillator.connect(gain).connect(audio.destination);
        oscillator.start(); oscillator.stop(audio.currentTime + duration);
      } catch (_) {}
    }

    function chooseGreens(count) {
      let available = cells.map((_, i) => i).filter(i => !activeGreens.has(i) && !redCells.has(i) && !blueCells.has(i) && !yellowCells.has(i) && !rockCells.has(i) && !lastGreens.has(i));
      if (available.length < count) available = cells.map((_, i) => i).filter(i => !activeGreens.has(i) && !redCells.has(i) && !blueCells.has(i) && !yellowCells.has(i) && !rockCells.has(i));
      const spawned = new Set();
      while (spawned.size < count && available.length) {
        const pick = Math.floor(Math.random() * available.length);
        const index = available.splice(pick, 1)[0];
        const expiry = setTimeout(() => expireGreen(index), GREEN_LIFETIME_MS);
        activeGreens.set(index, expiry);
        cells[index].classList.add('active');
        spawned.add(index);
      }
      lastGreens = spawned;
      roundStarted = performance.now();
      timerEl.classList.remove('danger');
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
      return [...spawned];
    }

    function clearGreen(index) {
      const expiry = activeGreens.get(index);
      if (expiry) clearTimeout(expiry);
      activeGreens.delete(index);
      cells[index].classList.remove('active');
    }

    function expireGreen(index) {
      if (!activeGreens.has(index)) return;
      clearGreen(index);
      graceCells.set(index, performance.now() + 300);
      losePoint('miss');
    }

    function spawnRed(preferredIndex) {
      if (!playing) return -1;
      const available = cells.map((_, i) => i).filter(i => !activeGreens.has(i) && !redCells.has(i) && !blueCells.has(i) && !yellowCells.has(i) && !rockCells.has(i));
      if (!available.length) return -1;
      const index = available.includes(preferredIndex)
        ? preferredIndex
        : available[Math.floor(Math.random() * available.length)];
      cells[index].classList.add('red');
      const expiry = setTimeout(() => clearRed(index), RED_LIFETIME_MS);
      redCells.set(index, expiry);
      return index;
    }

    function clearRed(index) {
      const expiry = redCells.get(index);
      if (expiry) clearTimeout(expiry);
      redCells.delete(index);
      cells[index].classList.remove('red');
    }

    function spawnBlue(preferredIndex, preferredDirection, tutorial = false) {
      if (!playing) return -1;
      const directions = ['up', 'right', 'down', 'left'];
      const arrows = { up: '↑', right: '→', down: '↓', left: '←' };
      const available = cells.map((_, i) => i).filter(i => !activeGreens.has(i) && !redCells.has(i) && !blueCells.has(i) && !yellowCells.has(i) && !rockCells.has(i) && !resolvingCells.has(i));
      if (!available.length) return -1;
      const index = available.includes(preferredIndex)
        ? preferredIndex
        : available[Math.floor(Math.random() * available.length)];
      const direction = directions.includes(preferredDirection)
        ? preferredDirection
        : directions[Math.floor(Math.random() * directions.length)];
      cells[index].dataset.arrow = arrows[direction];
      cells[index].dataset.direction = direction.toUpperCase();
      cells[index].classList.add('blue');
      cells[index].classList.toggle('tutorial', tutorial);
      const expiry = tutorial ? 0 : setTimeout(() => expireBlue(index), BLUE_LIFETIME_MS);
      blueCells.set(index, { direction, expiry, tutorial });
      return index;
    }

    function clearBlue(index) {
      const blue = blueCells.get(index);
      if (blue?.expiry) clearTimeout(blue.expiry);
      blueCells.delete(index);
      resolvingCells.delete(index);
      const animationTimer = animationTimers.get(index);
      if (animationTimer) clearTimeout(animationTimer);
      animationTimers.delete(index);
      cells[index].classList.remove('blue', 'tutorial', 'blue-wrong', 'slide-up', 'slide-right', 'slide-down', 'slide-left');
      delete cells[index].dataset.arrow;
      delete cells[index].dataset.direction;
    }

    function expireBlue(index) {
      const blue = blueCells.get(index);
      if (!blue || blue.tutorial) return;
      blueGraceCells = new Set([index]);
      blueGraceUntil = performance.now() + 300;
      clearBlue(index);
      losePoint('blue-miss');
    }

    function animateBlueSuccess(index, direction, tutorial) {
      const blue = blueCells.get(index);
      if (blue?.expiry) clearTimeout(blue.expiry);
      blueCells.delete(index);
      resolvingCells.add(index);
      cells[index].classList.add('hit', `slide-${direction}`);
      addScore();
      tone(820, .1);
      navigator.vibrate?.(18);
      const animationTimer = setTimeout(() => {
        resolvingCells.delete(index);
        animationTimers.delete(index);
        cells[index].classList.remove('blue', 'tutorial', 'hit', `slide-${direction}`);
        delete cells[index].dataset.arrow;
        delete cells[index].dataset.direction;
      }, 310);
      animationTimers.set(index, animationTimer);
      if (tutorial) {
        tutorialActive = false;
        blueUnlocked = true;
        phase2StartedAt = performance.now();
        checkpointScore = score;
        cycleTimer = setTimeout(() => playing && nextCycle(), 360);
      }
    }

    function resolveBlueSwipe(index, dx, dy) {
      const blue = blueCells.get(index);
      if (!blue) {
        if (resolvingCells.has(index)) return;
        if (blueGraceCells.has(index) && performance.now() <= blueGraceUntil) return;
        tap(index);
        return;
      }
      const farEnough = Math.max(Math.abs(dx), Math.abs(dy)) >= SWIPE_THRESHOLD;
      const direction = !farEnough ? 'tap'
        : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left')
        : (dy > 0 ? 'down' : 'up');
      const correct = direction === blue.direction;
      if (correct) {
        animateBlueSuccess(index, direction, blue.tutorial);
        return;
      }
      cells[index].classList.remove('blue-wrong', 'penalty');
      void cells[index].offsetWidth;
      cells[index].classList.add('blue-wrong', 'penalty');
      setTimeout(() => cells[index].classList.remove('blue-wrong', 'penalty'), 330);
      if (!blue.tutorial) {
        if (blue.expiry) clearTimeout(blue.expiry);
        blueCells.delete(index);
        resolvingCells.add(index);
        const animationTimer = setTimeout(() => {
          resolvingCells.delete(index);
          animationTimers.delete(index);
          cells[index].classList.remove('blue', 'tutorial');
          delete cells[index].dataset.arrow;
          delete cells[index].dataset.direction;
        }, 330);
        animationTimers.set(index, animationTimer);
      }
      losePoint('blue-wrong');
    }

    function spawnYellow(preferredIndex, tutorial = false) {
      if (!playing) return -1;
      const available = cells.map((_, i) => i).filter(i => !activeGreens.has(i) && !redCells.has(i) && !blueCells.has(i) && !yellowCells.has(i) && !rockCells.has(i) && !resolvingCells.has(i));
      if (!available.length) return -1;
      const index = available.includes(preferredIndex)
        ? preferredIndex
        : available[Math.floor(Math.random() * available.length)];
      cells[index].classList.add('yellow');
      cells[index].classList.toggle('tutorial', tutorial);
      const expiry = tutorial ? 0 : setTimeout(() => expireYellow(index), YELLOW_LIFETIME_MS);
      yellowCells.set(index, { expiry, tutorial, holding: false, holdTimer: 0 });
      return index;
    }

    function clearYellow(index) {
      const yellow = yellowCells.get(index);
      if (yellow?.expiry) clearTimeout(yellow.expiry);
      if (yellow?.holdTimer) clearTimeout(yellow.holdTimer);
      yellowCells.delete(index);
      resolvingCells.delete(index);
      const animationTimer = animationTimers.get(index);
      if (animationTimer) clearTimeout(animationTimer);
      animationTimers.delete(index);
      cells[index].classList.remove('yellow', 'tutorial', 'holding', 'yellow-bounce', 'hold-complete');
    }

    function expireYellow(index) {
      const yellow = yellowCells.get(index);
      if (!yellow || yellow.tutorial) return;
      yellowGraceCells = new Set([index]);
      yellowGraceUntil = performance.now() + 300;
      clearYellow(index);
      losePoint('yellow-miss');
    }

    function beginYellowHold(index) {
      const yellow = yellowCells.get(index);
      if (!yellow || yellow.holding || !playing) return;
      yellow.holding = true;
      cells[index].classList.remove('yellow-bounce');
      void cells[index].offsetWidth;
      cells[index].classList.add('holding');
      yellow.holdTimer = setTimeout(() => completeYellowHold(index), YELLOW_HOLD_MS);
    }

    function endYellowHold(index) {
      const yellow = yellowCells.get(index);
      if (!yellow || !yellow.holding) return;
      clearTimeout(yellow.holdTimer);
      yellow.holdTimer = 0;
      yellow.holding = false;
      cells[index].classList.remove('holding', 'yellow-bounce');
      void cells[index].offsetWidth;
      cells[index].classList.add('yellow-bounce');
      setTimeout(() => cells[index].classList.remove('yellow-bounce'), 390);
    }

    function completeYellowHold(index) {
      const yellow = yellowCells.get(index);
      if (!yellow) return;
      if (yellow.expiry) clearTimeout(yellow.expiry);
      if (yellow.holdTimer) clearTimeout(yellow.holdTimer);
      yellowCells.delete(index);
      resolvingCells.add(index);
      cells[index].classList.remove('holding', 'yellow-bounce', 'tutorial');
      cells[index].classList.add('hit', 'hold-complete');
      addScore();
      tone(920, .12);
      navigator.vibrate?.(24);
      const animationTimer = setTimeout(() => {
        resolvingCells.delete(index);
        animationTimers.delete(index);
        cells[index].classList.remove('yellow', 'tutorial', 'hit', 'hold-complete');
      }, 310);
      animationTimers.set(index, animationTimer);
      if (yellow.tutorial) {
        tutorialActive = false;
        yellowUnlocked = true;
        phase3StartedAt = performance.now();
        checkpointScore = score;
        cycleTimer = setTimeout(() => playing && nextCycle(), 380);
      }
    }

    function spawnRock(preferredIndex, tutorial = false) {
      if (!playing) return -1;
      const available = cells.map((_, i) => i).filter(i => !activeGreens.has(i) && !redCells.has(i) && !blueCells.has(i) && !yellowCells.has(i) && !rockCells.has(i) && !resolvingCells.has(i));
      if (!available.length) return -1;
      const index = available.includes(preferredIndex)
        ? preferredIndex
        : available[Math.floor(Math.random() * available.length)];
      cells[index].classList.add('rock');
      cells[index].classList.toggle('tutorial', tutorial);
      cells[index].dataset.hits = String(ROCK_HITS);
      const expiry = tutorial ? 0 : setTimeout(() => expireRock(index), ROCK_LIFETIME_MS);
      rockCells.set(index, { expiry, tutorial, hits: ROCK_HITS });
      return index;
    }

    function clearRock(index) {
      const rock = rockCells.get(index);
      if (rock?.expiry) clearTimeout(rock.expiry);
      rockCells.delete(index);
      resolvingCells.delete(index);
      const animationTimer = animationTimers.get(index);
      if (animationTimer) clearTimeout(animationTimer);
      animationTimers.delete(index);
      cells[index].classList.remove('rock', 'tutorial', 'cracked-2', 'cracked-1', 'rock-hit', 'rock-break');
      delete cells[index].dataset.hits;
    }

    function expireRock(index) {
      const rock = rockCells.get(index);
      if (!rock || rock.tutorial) return;
      rockGraceCells = new Set([index]);
      rockGraceUntil = performance.now() + 300;
      clearRock(index);
      losePoint('rock-miss');
    }

    function hitRock(index) {
      const rock = rockCells.get(index);
      if (!rock || !playing) return;
      rock.hits -= 1;
      cells[index].dataset.hits = String(rock.hits);
      cells[index].classList.remove('rock-hit', 'cracked-2', 'cracked-1');
      void cells[index].offsetWidth;
      if (rock.hits === 2) cells[index].classList.add('cracked-2');
      if (rock.hits === 1) cells[index].classList.add('cracked-1');
      cells[index].classList.add('rock-hit');
      tone(210 + (ROCK_HITS - rock.hits) * 75, .08, .045);
      navigator.vibrate?.(12);
      setTimeout(() => cells[index].classList.remove('rock-hit'), 170);
      if (rock.hits > 0) return;

      if (rock.expiry) clearTimeout(rock.expiry);
      rockCells.delete(index);
      resolvingCells.add(index);
      cells[index].classList.remove('tutorial', 'cracked-2', 'cracked-1', 'rock-hit');
      cells[index].classList.add('hit', 'rock-break');
      addScore();
      tone(1080, .14);
      navigator.vibrate?.([18, 20, 28]);
      const animationTimer = setTimeout(() => {
        resolvingCells.delete(index);
        animationTimers.delete(index);
        cells[index].classList.remove('rock', 'hit', 'rock-break');
        delete cells[index].dataset.hits;
      }, 340);
      animationTimers.set(index, animationTimer);
      if (rock.tutorial) {
        tutorialActive = false;
        rockUnlocked = true;
        phase4StartedAt = performance.now();
        checkpointScore = score;
        cycleTimer = setTimeout(() => playing && nextCycle(), 410);
      }
    }

    function wireCellGesture(cell, index) {
      let gesture = null;
      cell.addEventListener('pointerdown', event => {
        event.preventDefault();
        if (yellowCells.has(index)) {
          gesture = { yellow: true };
          beginYellowHold(index);
          try { cell.setPointerCapture(event.pointerId); } catch (_) {}
          return;
        }
        gesture = { x: event.clientX, y: event.clientY, blue: blueCells.has(index), yellow: false };
        try { cell.setPointerCapture(event.pointerId); } catch (_) {}
      });
      cell.addEventListener('pointerup', event => {
        if (!gesture) return;
        const start = gesture;
        gesture = null;
        if (start.yellow) {
          endYellowHold(index);
          return;
        }
        const dx = event.clientX - start.x;
        const dy = event.clientY - start.y;
        if (start.blue || blueCells.has(index) || (blueGraceCells.has(index) && performance.now() <= blueGraceUntil)) {
          resolveBlueSwipe(index, dx, dy);
        } else {
          tap(index);
        }
      });
      cell.addEventListener('pointercancel', () => {
        if (gesture?.yellow) endYellowHold(index);
        gesture = null;
      });
    }

    function clearBoardTargets() {
      activeGreens.forEach((_, index) => clearGreen(index));
      redCells.forEach((_, index) => clearRed(index));
      blueCells.forEach((_, index) => clearBlue(index));
      yellowCells.forEach((_, index) => clearYellow(index));
      rockCells.forEach((_, index) => clearRock(index));
      resolvingCells.forEach(index => {
        const animationTimer = animationTimers.get(index);
        if (animationTimer) clearTimeout(animationTimer);
        animationTimers.delete(index);
        resolvingCells.delete(index);
        cells[index].className = 'cell';
        delete cells[index].dataset.arrow;
        delete cells[index].dataset.direction;
        delete cells[index].dataset.hits;
      });
    }

    function showCheckpoint(title, subtitle, onComplete) {
      clearTimeout(checkpointTimer);
      checkpointTitleEl.textContent = title;
      checkpointSubtitleEl.textContent = subtitle;
      checkpointBanner.classList.remove('show');
      void checkpointBanner.offsetWidth;
      checkpointBanner.classList.add('show');
      checkpointTimer = setTimeout(() => {
        checkpointBanner.classList.remove('show');
        onComplete?.();
      }, 1550);
    }

    function spawnTutorialBlue() {
      if (!playing || blueUnlocked) return;
      tutorialActive = true;
      spawnBlue(undefined, undefined, true);
    }

    function spawnTutorialYellow() {
      if (!playing || yellowUnlocked) return;
      tutorialActive = true;
      spawnYellow(undefined, true);
    }

    function spawnTutorialRock() {
      if (!playing || rockUnlocked) return;
      tutorialActive = true;
      spawnRock(undefined, true);
    }

    function beginCheckpoint(level = 1) {
      if (!playing || level <= checkpointLevel) return;
      checkpointReached = true;
      checkpointLevel = level;
      checkpointScore = score;
      tutorialActive = false;
      clearTimeout(cycleTimer);
      cancelAnimationFrame(raf);
      clearBoardTargets();
      timerEl.style.transform = 'scaleX(0)';
      if (level === 1) {
        showCheckpoint('Checkpoint', 'Swipe move unlocked', spawnTutorialBlue);
      } else if (level === 2) {
        showCheckpoint('Checkpoint 2', 'Hold move unlocked', spawnTutorialYellow);
      } else {
        showCheckpoint('Checkpoint 3', 'Break move unlocked', spawnTutorialRock);
      }
    }

    function continueFromCheckpoint() {
      clearTimeout(cycleTimer);
      clearTimeout(checkpointTimer);
      clearBoardTargets();
      misses = 0;
      scoreEl.textContent = score;
      lifeEls.forEach(life => life.classList.remove('lost'));
      continueUsed = true;
      canContinue = false;
      playing = true;
      card.classList.remove('game-over');
      overlay.classList.add('hidden');
      gameStartedAt = performance.now() - BLUE_START_MS;
      showCheckpoint('Continue', `Checkpoint ${checkpointLevel} restored`, () => {
        if (!playing) return;
        if (checkpointLevel >= 3) {
          if (rockUnlocked) {
            phase4StartedAt = performance.now();
            nextCycle();
          } else {
            spawnTutorialRock();
          }
        } else if (checkpointLevel >= 2) {
          if (yellowUnlocked) {
            phase3StartedAt = performance.now();
            nextCycle();
          } else {
            spawnTutorialYellow();
          }
        } else if (blueUnlocked) {
          phase2StartedAt = performance.now();
          nextCycle();
        } else {
          spawnTutorialBlue();
        }
      });
    }

    function nextCycle() {
      if (!playing) return;
      const now = performance.now();
      const elapsed = now - gameStartedAt;
      if (elapsed >= BLUE_START_MS && checkpointLevel === 0) {
        beginCheckpoint(1);
        return;
      }
      if (checkpointLevel === 1 && !blueUnlocked) return;
      if (checkpointLevel === 2 && !yellowUnlocked) return;
      if (checkpointLevel >= 3 && !rockUnlocked) return;

      let greenCount = 1;
      let redChance = RED_CHANCE;
      let blueChance = 0;
      let blueCount = 1;
      let yellowChance = 0;
      let rockChance = 0;
      roundLength = BASE_BEAT_MS;

      if (rockUnlocked) {
        const phaseAge = now - phase4StartedAt;
        if (phaseAge < 5000) {
          redChance = .12; blueChance = .10; yellowChance = .08; rockChance = .06;
        } else if (phaseAge < 10000) {
          greenCount = Math.random() < .2 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : 850;
          redChance = .18; blueChance = .16; yellowChance = .12; rockChance = .1;
        } else if (phaseAge < PHASE_RAMP_MS) {
          const roll = Math.random();
          greenCount = roll < .1 ? 3 : roll < .45 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : 700;
          redChance = .23; blueChance = .21; yellowChance = .16; rockChance = .14;
        } else {
          const roll = Math.random();
          greenCount = roll < .25 ? 3 : roll < .65 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : FAST_BEAT_MS;
          redChance = .28; blueChance = .28; yellowChance = .22; rockChance = ROCK_CHANCE;
          blueCount = Math.random() < .45 ? 2 : 1;
        }
      } else if (yellowUnlocked) {
        const phaseAge = now - phase3StartedAt;
        if (phaseAge >= THIRD_CHECKPOINT_MS && checkpointLevel < 3) {
          beginCheckpoint(3);
          return;
        }
        if (phaseAge < 5000) {
          redChance = .12; blueChance = .10; yellowChance = .08;
        } else if (phaseAge < 10000) {
          greenCount = Math.random() < .2 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : 850;
          redChance = .18; blueChance = .16; yellowChance = .12;
        } else if (phaseAge < PHASE_RAMP_MS) {
          const roll = Math.random();
          greenCount = roll < .1 ? 3 : roll < .45 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : 700;
          redChance = .23; blueChance = .21; yellowChance = .16;
        } else if (phaseAge < 30000) {
          const roll = Math.random();
          greenCount = roll < .14 ? 3 : roll < .56 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : 650;
          redChance = .25; blueChance = .23; yellowChance = .18;
          blueCount = Math.random() < .25 ? 2 : 1;
        } else if (phaseAge < 45000) {
          const roll = Math.random();
          greenCount = roll < .22 ? 3 : roll < .64 ? 2 : 1;
          roundLength = greenCount > 1 ? 900 : 550;
          redChance = .28; blueChance = .27; yellowChance = .22;
          blueCount = Math.random() < .4 ? 2 : 1;
        } else {
          const roll = Math.random();
          greenCount = roll < .3 ? 3 : roll < .7 ? 2 : 1;
          roundLength = greenCount > 1 ? 850 : FAST_BEAT_MS;
          redChance = .32; blueChance = .32; yellowChance = .26;
          blueCount = Math.random() < .55 ? 2 : 1;
        }
      } else if (blueUnlocked) {
        const phaseAge = now - phase2StartedAt;
        if (phaseAge >= SECOND_CHECKPOINT_MS && checkpointLevel < 2) {
          beginCheckpoint(2);
          return;
        }
        if (phaseAge < 5000) {
          redChance = .15; blueChance = .12;
        } else if (phaseAge < 10000) {
          roundLength = 850;
          redChance = .20; blueChance = .17;
        } else if (phaseAge < PHASE_RAMP_MS) {
          greenCount = Math.random() < .2 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : 750;
          redChance = .22; blueChance = .20;
        } else {
          const roll = Math.random();
          greenCount = phaseAge >= TRIPLE_GREEN_START_MS && roll < .18 ? 3 : roll < .58 ? 2 : 1;
          roundLength = greenCount > 1 ? BASE_BEAT_MS : FAST_BEAT_MS;
          blueChance = BLUE_CHANCE;
          if (phaseAge >= DOUBLE_BLUE_START_MS) blueCount = Math.random() < .35 ? 2 : 1;
        }
      } else {
        if (elapsed >= CHAOS_START_MS) {
          const doubleGreenRound = Math.random() < .5;
          greenCount = doubleGreenRound ? 2 : 1;
          roundLength = doubleGreenRound ? BASE_BEAT_MS : FAST_BEAT_MS;
        }
        redChance = elapsed >= RED_START_MS ? RED_CHANCE : 0;
      }

      chooseGreens(greenCount);
      if (Math.random() < redChance) spawnRed();
      if (blueUnlocked && Math.random() < blueChance) {
        for (let i = 0; i < blueCount; i++) spawnBlue();
      }
      if (yellowUnlocked && yellowCells.size === 0 && Math.random() < yellowChance) spawnYellow();
      if (rockUnlocked && rockCells.size === 0 && Math.random() < rockChance) spawnRock();
      clearTimeout(cycleTimer);
      cycleTimer = setTimeout(nextCycle, roundLength);
    }

    function tick(now) {
      if (!playing) return;
      const remaining = Math.max(0, 1 - (now - roundStarted) / roundLength);
      timerEl.style.transform = `scaleX(${remaining})`;
      timerEl.classList.toggle('danger', remaining < .28);
      if (remaining <= 0) return;
      raf = requestAnimationFrame(tick);
    }

    function tap(index) {
      if (!playing || resolvingCells.has(index)) return;
      if (rockCells.has(index)) {
        hitRock(index);
        return;
      }
      if (rockGraceCells.has(index) && performance.now() <= rockGraceUntil) return;
      if (yellowCells.has(index)) {
        beginYellowHold(index);
        setTimeout(() => endYellowHold(index), 0);
        return;
      }
      if (yellowGraceCells.has(index) && performance.now() <= yellowGraceUntil) return;
      if (blueCells.has(index)) {
        resolveBlueSwipe(index, 0, 0);
        return;
      }
      if (redCells.has(index)) {
        clearRed(index);
        cells[index].classList.add('penalty');
        setTimeout(() => cells[index].classList.remove('penalty'), 280);
        losePoint('red');
        return;
      }
      if (!activeGreens.has(index)) {
        if ((graceCells.get(index) || 0) >= performance.now()) return;
        cells[index].classList.remove('penalty');
        void cells[index].offsetWidth;
        cells[index].classList.add('penalty');
        setTimeout(() => cells[index].classList.remove('penalty'), 280);
        losePoint('empty');
        return;
      }
      clearGreen(index);
      cells[index].classList.add('hit');
      setTimeout(() => cells[index].classList.remove('hit'), 240);
      addScore();
      tone(660 + Math.min(score, 12) * 18, .09);
      navigator.vibrate?.(18);
    }

    function losePoint(reason = 'miss') {
      misses += 1;
      lifeEls[misses - 1]?.classList.add('lost');
      tone(reason === 'red' ? 90 : 110, .22, .055);
      navigator.vibrate?.([70, 30, 70]);
      if (misses >= 4) gameOver();
    }

    function startGame() {
      clearTimeout(cycleTimer);
      clearTimeout(checkpointTimer);
      checkpointBanner.classList.remove('show');
      clearBoardTargets();
      cells.forEach(cell => cell.className = 'cell');
      score = 0;
      misses = 0;
      graceCells.clear();
      blueGraceCells.clear();
      blueGraceUntil = 0;
      yellowGraceCells.clear();
      yellowGraceUntil = 0;
      rockGraceCells.clear();
      rockGraceUntil = 0;
      resolvingCells.clear();
      animationTimers.clear();
      checkpointReached = false;
      checkpointLevel = 0;
      blueUnlocked = false;
      yellowUnlocked = false;
      rockUnlocked = false;
      tutorialActive = false;
      phase2StartedAt = 0;
      phase3StartedAt = 0;
      phase4StartedAt = 0;
      checkpointScore = 0;
      continueUsed = false;
      canContinue = false;
      playing = true;
      scoreEl.textContent = '0';
      lifeEls.forEach(life => life.classList.remove('lost'));
      card.classList.remove('game-over');
      overlay.classList.add('hidden');
      tone(420, .08);
      gameStartedAt = performance.now();
      roundLength = BASE_BEAT_MS;
      cycleTimer = setTimeout(nextCycle, 280);
    }

    function gameOver() {
      playing = false;
      clearTimeout(cycleTimer);
      clearTimeout(checkpointTimer);
      cancelAnimationFrame(raf);
      checkpointBanner.classList.remove('show');
      clearBoardTargets();
      canContinue = checkpointReached && !continueUsed;
      finalScoreEl.textContent = score;
      if (canContinue) {
        titleEl.textContent = 'Checkpoint saved.';
        subtitleEl.textContent = `One continue available. Restart from checkpoint ${checkpointLevel}.`;
        startBtn.textContent = 'Continue';
      } else {
        titleEl.textContent = score >= 20 ? 'Sharp.' : score >= 10 ? 'Not bad.' : 'Game over.';
        subtitleEl.textContent = score ? `You scored ${score}. Go again.` : 'The green tile got away. Go again.';
        startBtn.textContent = 'Play again';
      }
      card.classList.add('game-over');
      overlay.classList.remove('hidden');
    }

    function handleStartButton() {
      if (canContinue) continueFromCheckpoint(); else startGame();
    }

    startBtn.addEventListener('click', handleStartButton);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && playing) {
        clearTimeout(cycleTimer);
        cancelAnimationFrame(raf);
        clearBoardTargets();
      } else if (!document.hidden && playing) {
        if (checkpointLevel >= 3 && !rockUnlocked) spawnTutorialRock();
        else if (checkpointLevel >= 2 && !yellowUnlocked) spawnTutorialYellow();
        else if (checkpointLevel === 1 && !blueUnlocked) spawnTutorialBlue();
        else nextCycle();
      }
    });

    window.__mook = {
      startGame, continueFromCheckpoint, beginCheckpoint, tap,
      spawnRed, spawnBlue, spawnYellow, spawnRock, spawnGreens: chooseGreens,
      resolveBlueSwipe, beginYellowHold, endYellowHold, completeYellowHold, hitRock, losePoint, nextCycle,
      pauseSpawnsForTest: () => clearTimeout(cycleTimer),
      setElapsedForTest: milliseconds => { gameStartedAt = performance.now() - milliseconds; },
      setPhase2AgeForTest: milliseconds => { phase2StartedAt = performance.now() - milliseconds; },
      setPhase3AgeForTest: milliseconds => { phase3StartedAt = performance.now() - milliseconds; },
      setPhase4AgeForTest: milliseconds => { phase4StartedAt = performance.now() - milliseconds; },
      getState: () => ({
        active: [...activeGreens.keys()], score, misses, playing,
        red: [...redCells.keys()],
        blue: [...blueCells.entries()].map(([index, value]) => ({ index, direction: value.direction, tutorial: value.tutorial })),
        yellow: [...yellowCells.entries()].map(([index, value]) => ({ index, tutorial: value.tutorial, holding: value.holding })),
        rock: [...rockCells.entries()].map(([index, value]) => ({ index, tutorial: value.tutorial, hits: value.hits })),
        elapsed: performance.now() - gameStartedAt, roundLength,
        checkpointReached, checkpointLevel, blueUnlocked, yellowUnlocked, rockUnlocked, tutorialActive,
        phase2Age: phase2StartedAt ? performance.now() - phase2StartedAt : 0,
        phase3Age: phase3StartedAt ? performance.now() - phase3StartedAt : 0,
        phase4Age: phase4StartedAt ? performance.now() - phase4StartedAt : 0,
        highScore,
        checkpointScore, continueUsed, canContinue,
        checkpointVisible: checkpointBanner.classList.contains('show')
      })
    };
  </script>
</body>
